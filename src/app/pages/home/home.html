
<div id="resumeForm">

    <div>
        <h2>
            Informações Pessoais
        </h2>
        <div class="personal-info">
            <label>
                Primeiro Nome
                <input type="text" id="firstName">
            </label>

            <label>
                Último Nome
                <input type="text" id="lastName">
            </label>

            <label>
                Email
                <input type="text" id="email">
            </label>

            <label>
                Telefone
                <input type="text" id="phoneNumber">
            </label>

            <label>
                Redes sociais
                <input type="text" id="socialMedia">
            </label>
        </div>
    </div>
    <div class="academic-formation">
        <div>
            <h2>
                Formação Acadêmica
            </h2>
            <div>
                <p>
                    Insira as informações a respeito de sua formação acadêmica.
                </p>
                <div>
                    <input type="text" placeholder="Insira o nome da sua instituição" id="university">
                </div>
                <div>
                    <input type="text" placeholder="Insira o nome do seu curso" id="course">                    
                </div>
            </div>
        </div>
        <br>
        <br>
        <br>
        <div class="professional-experience">
            <div>
                <h2>
                    Experiência Profissional
                </h2>
            </div>
            <div>
                <p>
                    Mostre sua experiência relevante (durante os últimos 10 anos). Desejável utilizar marcadores para destacar as experiências.
                </p>
                <ul>
                    <label>
                        Nome da Empresa
                        <input type="text" id="lastCompanyName">
                    </label>
                    <input type="text" placeholder="Descreva suas funções e o que aprendeu no cargo" id="workExp">   
                </ul>
            </div>
        </div>
        <br>
                <div class="additional-info">
            <div>
                <h2>
                    Infomações Adicionais
                </h2>
            </div>
            <div>
                <ul>
                    <input type="text" placeholder="Informe sobre suas qualidades e formações adjacentes" id="extraExp">
                    <button type="button" id="printResume" (click)="submitForm()">
                        Criar curriculo
                    </button >
                </ul>
            </div>
        </div>
    </div>
</div>
